# Enable through sites-enabled/zz-alephcenter.net to preserve existing site order.
server {
    listen 80;
    listen [::]:80;
    server_name alephcenter.net www.alephcenter.net;

    root /var/www/aleph;
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://alephcenter.net$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.alephcenter.net;

    ssl_certificate /etc/letsencrypt/live/alephcenter.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alephcenter.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://alephcenter.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name alephcenter.net;

    root /var/www/aleph;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/alephcenter.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alephcenter.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/alephcenter.net.access.log;
    error_log /var/log/nginx/alephcenter.net.error.log;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
